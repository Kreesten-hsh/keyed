site_name: keyed
site_description: Local API key authentication and rate limiting for FastAPI
site_author: keyed

exclude_docs: |
  plans/*

theme:
  name: material
  palette:
    - scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font:
    text: Geist
    code: JetBrains Mono
  features:
    - content.code.copy
    - navigation.instant
    - navigation.tracking
    - navigation.top

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details

nav:
  - Quickstart: index.md
  - Installation: installation.md
  - API Reference: api-reference.md
